<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e8452c">
<title>UniMart · Campus marketplace</title>
<meta name="description" content="The campus marketplace for Sri Lankan university students. Buy and sell items and services with students near you.">
<link rel="icon" type="image/svg+xml" href="img/logo.svg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar">
  <div class="wrap topbar-row">
    <a class="logo" href="#/" aria-label="UniMart home">
      <img src="img/logo.svg" alt="" width="34" height="34">
      <span>Uni<b>Mart</b></span>
    </a>
    <form class="search" id="search-form" role="search">
      <input id="search-input" type="search" placeholder="Search books, laptops, tutoring…" aria-label="Search">
      <button type="submit" aria-label="Search"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M10.5 4a6.5 6.5 0 1 0 4.03 11.6l4.43 4.43 1.41-1.41-4.43-4.43A6.5 6.5 0 0 0 10.5 4Zm0 2a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9Z" fill="currentColor"/></svg></button>
    </form>
    <nav class="topnav">
      <a href="#/sell" class="btn-sell">+ Sell</a>
      <a href="#/messages" data-nav="messages">Messages<span class="dot" id="msg-dot" hidden></span></a>
      <a href="#/cart" data-nav="cart">Cart <span class="badge" id="cart-count">0</span></a>
      <a href="#/account" data-nav="account" id="account-link">Sign in</a>
    </nav>
  </div>
</header>

<div class="announce" id="announce" hidden><div class="wrap"><span id="announce-text"></span><button id="announce-x" aria-label="Close">×</button></div></div>

<main id="view" class="wrap" tabindex="-1"></main>

<footer class="footer">
  <div class="wrap">
    <p><b>UniMart</b> · the campus marketplace for Sri Lankan university students. Meet in safe public places on campus and never pay before you see the item.<span id="mode-note"></span></p>
    <p><a href="#/browse">Browse</a> · <a href="#/sell">Sell</a> · <a href="admin.html">Admin</a> · <a href="#" id="reset-demo">Reset demo data</a></p>
  </div>
</footer>

<nav class="bottom-nav" aria-label="Main">
  <a href="#/" data-nav="home"><svg viewBox="0 0 24 24"><path d="M12 3 3 10v11h6v-6h6v6h6V10z" fill="currentColor"/></svg>Home</a>
  <a href="#/browse" data-nav="browse"><svg viewBox="0 0 24 24"><path d="M4 4h7v7H4zm9 0h7v7h-7zM4 13h7v7H4zm9 0h7v7h-7z" fill="currentColor"/></svg>Browse</a>
  <a href="#/sell" data-nav="sell" class="sell-tab"><span>+</span>Sell</a>
  <a href="#/cart" data-nav="cart"><svg viewBox="0 0 24 24"><path d="M7 18a2 2 0 1 0 0 4 2 2 0 0 0 0-4Zm10 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4ZM3 2h3l2.6 12.4A2 2 0 0 0 10.5 16H19v-2h-8.4l-.4-2H19l2-8H6.4L5.6 2z" fill="currentColor"/></svg>Cart<span class="badge sm" id="cart-count-m" hidden>0</span></a>
  <a href="#/account" data-nav="account"><svg viewBox="0 0 24 24"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10Zm0 2c-5 0-9 2.5-9 6v2h18v-2c0-3.5-4-6-9-6Z" fill="currentColor"/></svg>Me</a>
</nav>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="js/config.js"></script>
<script src="js/data.js"></script>
<script src="js/ui.js"></script>
<script src="js/db-local.js"></script>
<script src="js/db-firebase.js"></script>
<script src="js/store.js"></script>
<script src="js/app.js"></script>
</body>
</html>
