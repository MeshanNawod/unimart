<header class="topbar">
  <div class="wrap topbar-row">
    <a class="logo" href="#/" aria-label="UniMart home">
      <img src="img/logo.svg" alt="" width="34" height="34">
      <span>Uni<b>Mart</b></span>
    </a>
    <form class="search" id="search-form" role="search">
      <input id="search-input" type="search" placeholder="Search books, laptops, tutoring…" aria-label="Search">
      <button type="submit" aria-label="Search"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M10.5 4a6.5 6.5 0 1 0 4.03 11.6l4.43 4.43 1.41-1.41-4.43-4.43A6.5 6.5 0 0 0 10.5 4Zm0 2a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9Z" fill="currentColor"/></svg></button>

    <nav class="topnav">
      <a href="#/sell" class="btn-sell">+ Sell</a>
      <a href="#/messages" data-nav="messages">Messages<span class="dot" id="msg-dot" hidden></span></a>
      <a href="#/cart" data-nav="cart">Cart <span class="badge" id="cart-count">0</span></a>
      <a href="#/account" data-nav="account" id="account-link">Sign in</a>
    </nav>
    <select class="lang-pick notr" id="lang-pick" aria-label="Language"><option value="en">English</option><option value="si">සිංහල</option><option value="ta">தமிழ்</option></select>
  </div>
</header>

<main id="view" class="wrap" tabindex="-1"></main>

    <p><b>UniMart</b> · the campus marketplace for Sri Lankan university students. Meet in safe public places on campus and never pay before you see the item.<span id="mode-note"></span></p>

  </div>
</footer>
